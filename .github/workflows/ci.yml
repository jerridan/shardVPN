name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install pytest boto3 ruff
      - run: ruff check .
      # ruff format's default file discovery includes *.md and reformats
      # Python code fences within. docs/superpowers/plans/2026-08-01-shardvpn-v2.md
      # is the design plan, not project source, and isn't ours to reformat here.
      # Scoped to this invocation only (--extend-exclude, not pyproject.toml)
      # so `ruff check` above keeps full, unmodified file discovery.
      - run: ruff format --check . --extend-exclude docs/superpowers/plans/2026-08-01-shardvpn-v2.md
      - run: pytest -v
