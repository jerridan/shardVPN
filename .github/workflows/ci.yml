name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exact version, not @v9: astral-sh/setup-uv publishes only precise tags
      # (v9.0.0) and minor movers (v7.6) — there is no bare major tag, so @v9
      # fails to resolve. Verified against the repo's tag list.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.13'
      # --locked fails rather than silently resolving differently, so CI runs
      # the exact tool versions uv.lock pins.
      - run: uv sync --group dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck lambda/shardvpn/userdata.sh

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform

  scan:
    runs-on: ubuntu-latest
    # gitleaks-action calls the Pulls API to fetch the commit range to scan
    # and, on a leak, to comment on the PR; both need write, which the
    # job-level block grants without widening the other jobs' read-only
    # default above.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks-action diffs baseRef^..headRef; a shallow clone (the
          # checkout default) doesn't contain that history, so full depth is
          # required or the scan silently covers the wrong range.
          fetch-depth: 0
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: '1'
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          # Required since a recent gitleaks-action update: v3 refuses to
          # scan pull requests without it (unrelated to AWS credentials —
          # this is the ephemeral, auto-issued GitHub Actions token).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
