[project]
name = "shardvpn"
version = "2.0.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lambda"]

[tool.ruff]
line-length = 100
target-version = "py313"
# ruff's default `include` covers *.md for docstring/code-fence formatting.
# docs/ holds the design spec and plan (untouched, not part of the project
# source) and must not be reformatted by this task's tooling.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101 assert-in-tests; S105/S106 flag test fixtures named "secret"/"password".
ignore = ["S101", "S105", "S106"]
