[project]
name = "shardvpn"
version = "2.0.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lambda"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101 assert-in-tests; S105/S106 flag test fixtures named "secret"/"password".
ignore = ["S101", "S105", "S106"]
